name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # The codebase is at zero ESLint problems - keep it there.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build
        env:
          VITE_BACKEND_URL: https://ci.invalid/v1
